services:
  uglytags-app:
    image: ${UGLYTAGS_IMAGE:-ghcr.io/dvir001/uglytags:latest}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MAX_MEDIA_MB: ${MAX_MEDIA_MB:-20}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-50}
      MAX_IMPORT_DOWNLOADS: ${MAX_IMPORT_DOWNLOADS:-500}
      MAX_IMPORT_DOWNLOAD_MB: ${MAX_IMPORT_DOWNLOAD_MB:-200}
      DEAD_LINK_DAYS: ${DEAD_LINK_DAYS:-7}
    depends_on:
      uglytags-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  uglytags-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uglytags
      POSTGRES_USER: uglytags
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U uglytags -d uglytags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
